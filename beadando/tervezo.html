<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Pöltl Zorka">
    <meta name="description" content="Utazástervező űrlap, amely alapján egyéni útiterv generálható.">
    <title>PlanYourTrip – Utazástervező</title>

    <link rel="icon" type="image/jpeg" href="images/ikon.jpg">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="main-nav">
            <div class="logo">
                <a href="index.html">PlanYourTrip</a>
            </div>
            <ul>
                <li><a href="index.html">Kezdőlap</a></li>
                <li><a href="uticelok.html">Úticélok</a></li>
                <li><a href="tervezo.html" class="active">Utazástervező</a></li>
                <li><a href="utiterv.html">Útiterv</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Utazástervező űrlap</h1>
            <p>Töltsd ki az alábbi űrlapot, és a megadott adatok alapján egy egyszerű útitervet generálunk.</p>
        </section>

        <section class="form-section">
            <form id="travel-form" action="utiterv.html" method="GET">
                <!-- 1. Név -->
                <div class="form-group">
                    <label for="name">Név*</label>
                    <input type="text" id="name" name="name" placeholder="Pl. Kiss Anna">
                    <div class="error-message" id="error-name"></div>
                </div>

                <!-- 2. Email -->
                <div class="form-group">
                    <label for="email">Email cím*</label>
                    <input type="email" id="email" name="email" placeholder="pelda@mail.com">
                    <div class="error-message" id="error-email"></div>
                </div>

                <!-- 3. Úticél -->
                <div class="form-group">
                    <label for="destination">Választott úticél*</label>
                    <select id="destination" name="destination">
                        <option value="">-- Válassz úticélt --</option>
                        <option value="Róma">Róma</option>
                        <option value="Párizs">Párizs</option>
                        <option value="Barcelona">Barcelona</option>
                        <option value="London">London</option>
                    </select>
                    <div class="error-message" id="error-destination"></div>
                </div>

                <!-- 4. Indulás dátuma -->
                <div class="form-group">
                    <label for="start-date">Indulás dátuma*</label>
                    <input type="date" id="start-date" name="start-date">
                    <div class="error-message" id="error-start-date"></div>
                </div>

                <!-- 5. Érkezés dátuma -->
                <div class="form-group">
                    <label for="end-date">Érkezés dátuma*</label>
                    <input type="date" id="end-date" name="end-date">
                    <div class="error-message" id="error-end-date"></div>
                </div>

                <!-- 6. Költségkeret -->
                <div class="form-group">
                    <label for="budget">Költségkeret (EUR)*</label>
                    <input type="number" id="budget" name="budget" min="1">
                    <div class="error-message" id="error-budget"></div>
                </div>

                <!-- 7. Utazási stílus (radio) -->
                <div class="form-group">
                    <label>Utazási stílus*</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="tipus" value="varosnezes" id="varosnezes" checked >
                            Városnézés
                        </label>
                        <label>
                            <input type="radio" name="tipus" value="termeszet" id="termeszet" >
                            Természet
                        </label>
                        <label>
                            <input type="radio" name="tipus" value="vegyes" id="vegyes">
                            Vegyes
                        </label>
                    </div>
                </div>

                <!-- 8. Extra megjegyzés -->
                <div class="form-group">
                    <label for="notes">Extra igények / megjegyzés</label>
                    <textarea id="notes" name="notes" rows="4"></textarea>
                </div>

                <!-- 10. CHECKBOX (Jelölőnégyzet) -->
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" name="terms_accepted">
                    <label for="terms">Elfogadom az Adatvédelmi Nyilatkozatot *</label>
                    <div id="error-terms" class="error-message"></div>
                </div>

                <button type="submit" class="btn-primary">Útiterv generálása</button>
                <p class="form-note">* A csillaggal jelölt mezők kitöltése kötelező.</p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 PlanYourTrip – Pöltl Zorka</p>
    </footer>

    <!-- JS validáláshoz -->
    <script src="pt.js" defer></script> 
</body>
</html>
